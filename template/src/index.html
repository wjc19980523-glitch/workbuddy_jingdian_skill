<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>city scenic</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  body { width: 1080px; height: 1920px; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05070a;
           font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; color: #fff; }
  .shot { position: absolute; inset: 0; overflow: hidden; perspective: 1400px; perspective-origin: 540px 960px;
          transform-origin: 540px 960px; display: none; }
  .layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .ph { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; }
  .ph img { display: block; width: 100%; height: 100%; }
  .card { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 26px;
          box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.18) inset; background: #111; }
  .card img { position: absolute; left: 0; top: 0; }
  .bgblur { position: absolute; inset: -80px; background-size: cover; background-position: center;
            filter: blur(38px) brightness(.45) saturate(1.2); }
  .grade { }   /* colour grade is baked into the jpgs by fetch_images.py (CSS filters cost 5x render time) */
  canvas { position: absolute; left: 0; top: 0; }
  .txt { position: absolute; left: 0; top: 0; white-space: pre; will-change: transform, opacity; }
  .serif { font-family: "Noto Serif CJK SC", "Noto Serif CJK", serif; font-weight: 700; }
  .kai { font-family: "LXGW WenKai", "Noto Serif CJK SC", serif; }
  .ch { display: inline-block; will-change: transform, opacity, filter; }
  .shadow { text-shadow: 0 4px 24px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.45); }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse 85% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #shade { position: absolute; inset: 0; pointer-events: none; }
  #leak { position: absolute; inset: -20%; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #grain { mix-blend-mode: overlay; opacity: .07; pointer-events: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .seal { position: absolute; border: 4px solid #e2402f; color: #e2402f; background: rgba(255,250,240,.0);
          font-family: "Noto Serif CJK SC", serif; font-weight: 700; padding: 6px 10px; border-radius: 6px; }
  .tag { position: absolute; font-size: 22px; letter-spacing: 1px; color: rgba(255,255,255,.88);
         background: rgba(0,0,0,.38); padding: 6px 12px; border-radius: 8px; }
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <div id="shade"></div>
  <div id="vignette"></div>
  <div id="leak"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="hud"></div>
  <div id="flash"></div>
</div>
<script src="timeline.js"></script>
<script src="app.js"></script>
</body>
</html>
